<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Speedtest History</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Internet Speed Over Time</h1>
  <canvas id="speedChart" width="800" height="400"></canvas>
  <script>
    fetch('/data')
      .then(r => r.json())
      .then(data => {
        const labels = data.map(e => new Date(e.time).toLocaleTimeString());
        const dl = data.map(e => e.download);
        const ul = data.map(e => e.upload);
        new Chart(document.getElementById('speedChart').getContext('2d'), {
          type: 'line',
          data: {
            labels,
            datasets: [
              { label: 'Download (Mbps)', data: dl, fill: false },
              { label: 'Upload (Mbps)', data: ul, fill: false }
            ]
          },
          options: {
            scales: { x: { display: true }, y: { beginAtZero: true } }
          }
        });
      });
  </script>
</body>
</html>
